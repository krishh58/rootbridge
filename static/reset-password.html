<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — RootBridge</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Georgia',serif;background:#0f172a;color:#f1f5f9;min-height:100vh;
       display:flex;align-items:center;justify-content:center;padding:1.5rem}
  .card{background:#1e293b;border-radius:12px;padding:2.5rem 2rem;width:100%;max-width:400px;
        border:1px solid #334155}
  h1{font-size:1.5rem;color:#e2d9c4;margin-bottom:.4rem}
  p.sub{color:#94a3b8;font-size:.875rem;margin-bottom:1.5rem}
  label{display:block;font-size:.82rem;color:#94a3b8;margin-bottom:.3rem}
  input{width:100%;background:#0f172a;border:1px solid #334155;color:#f1f5f9;
        padding:.6rem .8rem;border-radius:6px;font-size:.95rem;margin-bottom:1rem}
  input:focus{outline:2px solid #2563eb;border-color:transparent}
  button{width:100%;background:#2563eb;color:#fff;border:none;border-radius:6px;
         padding:.75rem;font-size:.95rem;cursor:pointer;font-weight:600}
  button:hover{background:#1d4ed8}
  button:disabled{background:#475569;cursor:not-allowed}
  .msg{font-size:.875rem;margin-top:1rem;padding:.6rem .8rem;border-radius:6px;display:none}
  .msg.success{background:#14532d;color:#86efac;display:block}
  .msg.error{background:#7f1d1d;color:#fca5a5;display:block}
  .back{display:block;text-align:center;margin-top:1.25rem;color:#60a5fa;font-size:.875rem;text-decoration:none}
  .back:hover{text-decoration:underline}
  #requestForm, #resetForm{display:none}
</style>
</head>
<body>
<div class="card">
  <h1>🌿 RootBridge</h1>

  <!-- Step 1: enter email -->
  <div id="requestForm">
    <p class="sub">Enter your email and we'll send a reset link.</p>
    <label for="emailInput">Email address</label>
    <input type="email" id="emailInput" placeholder="you@example.com" autocomplete="email">
    <button id="sendBtn" onclick="sendReset()">Send Reset Link</button>
    <div id="requestMsg" class="msg"></div>
    <a href="/" class="back">← Back to RootBridge</a>
  </div>

  <!-- Step 2: enter new password (when token in URL) -->
  <div id="resetForm">
    <p class="sub">Choose a new password for your account.</p>
    <label for="pwInput">New password</label>
    <input type="password" id="pwInput" placeholder="At least 8 characters" autocomplete="new-password">
    <label for="pw2Input">Confirm password</label>
    <input type="password" id="pw2Input" placeholder="Repeat password" autocomplete="new-password">
    <button id="resetBtn" onclick="doReset()">Set New Password</button>
    <div id="resetMsg" class="msg"></div>
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  const success = params.get('success');

  if (token) {
    document.getElementById('resetForm').style.display = 'block';
  } else {
    document.getElementById('requestForm').style.display = 'block';
    if (success === '1') {
      const msg = document.getElementById('requestMsg');
      msg.className = 'msg success';
      msg.textContent = 'Password updated! You can now log in.';
    }
  }

  async function sendReset() {
    const email = document.getElementById('emailInput').value.trim();
    const btn = document.getElementById('sendBtn');
    const msg = document.getElementById('requestMsg');
    if (!email) { showMsg(msg, 'error', 'Enter your email address.'); return; }
    btn.disabled = true; btn.textContent = 'Sending…';
    await fetch('/api/auth/forgot-password', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({email}),
    });
    btn.disabled = false; btn.textContent = 'Send Reset Link';
    showMsg(msg, 'success', 'If that email is registered, a reset link is on its way.');
  }

  async function doReset() {
    const password = document.getElementById('pwInput').value;
    const confirm = document.getElementById('pw2Input').value;
    const btn = document.getElementById('resetBtn');
    const msg = document.getElementById('resetMsg');
    if (password.length < 8) { showMsg(msg, 'error', 'Password must be at least 8 characters.'); return; }
    if (password !== confirm) { showMsg(msg, 'error', 'Passwords do not match.'); return; }
    btn.disabled = true; btn.textContent = 'Saving…';
    const r = await fetch('/api/auth/reset-password', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({token, password}),
    });
    const data = await r.json();
    btn.disabled = false; btn.textContent = 'Set New Password';
    if (r.ok) {
      showMsg(msg, 'success', 'Password updated! Redirecting to login…');
      setTimeout(() => window.location.href = '/?reset=1', 2000);
    } else {
      showMsg(msg, 'error', data.error || 'Something went wrong. Try requesting a new link.');
    }
  }

  function showMsg(el, type, text) {
    el.className = 'msg ' + type;
    el.textContent = text;
  }

  document.getElementById('emailInput')?.addEventListener('keydown', e => {
    if (e.key === 'Enter') sendReset();
  });
  document.getElementById('pw2Input')?.addEventListener('keydown', e => {
    if (e.key === 'Enter') doReset();
  });
</script>
</body>
</html>
