<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RootBridge — Your Family Tree</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script>
    const refCode = new URLSearchParams(window.location.search).get('ref') || '';
  </script>
</head>
<body>
  <nav class="nav">
    <a href="/" class="nav-brand">RootBridge</a>
    <div class="nav-right">
      <span class="token-badge" id="tokenBadge">— tokens</span>
      <a href="/account" class="btn-ghost" style="text-decoration:none;margin-right:8px">My Account</a>
      <button class="btn-ghost" onclick="logout()">Logout</button>
    </div>
  </nav>

  <!-- Tab bar -->
  <div class="tab-bar" style="display:flex;gap:4px;padding:0 16px;background:#0f172a;border-bottom:1px solid #1e293b">
    <button class="tab-btn" data-tab="tree" onclick="switchTab('tree')"
            style="background:none;border:none;border-bottom:2px solid #4a7c59;color:#f8fafc;padding:10px 16px;cursor:pointer;font-size:0.9em">
      Family Tree
    </button>
    <button class="tab-btn" data-tab="connections" onclick="switchTab('connections')"
            style="background:none;border:none;border-bottom:2px solid transparent;color:#94a3b8;padding:10px 16px;cursor:pointer;font-size:0.9em">
      Connections <span id="connections-badge" style="display:none;background:#ef4444;color:#fff;border-radius:10px;padding:0 6px;font-size:0.75em;margin-left:4px"></span>
    </button>
  </div>

  <!-- Tree tab panel -->
  <div id="tab-tree" class="tab-panel" style="display:flex">
    <div class="app-layout" style="flex:1;display:flex">
      <aside class="sidebar">
        <h2>My Trees</h2>
        <div id="savedTreesList" style="margin-bottom:.75rem"></div>
        <div id="treeList"></div>
        <button class="btn-primary" onclick="showAddPersonForm()">+ Add Person</button>
        <div id="exportButtons" style="display:none;margin-top:.75rem;flex-direction:column;gap:.5rem">
          <button class="btn-ghost" style="font-size:.8rem;padding:.4rem .75rem" onclick="downloadGedcom()">⬇ Download GEDCOM</button>
          <button class="btn-ghost" style="font-size:.8rem;padding:.4rem .75rem" onclick="downloadPdf()">⬇ Download PDF</button>
        </div>
        <div style="margin-top:.5rem">
          <label style="font-size:.78rem;color:#64748b;cursor:pointer;display:flex;align-items:center;gap:.4rem">
            <input type="file" id="gedcomImport" accept=".ged,.gedcom" style="display:none" onchange="importGedcom(this)">
            ↑ Import GEDCOM file
          </label>
        </div>

        <div id="referralPanel" style="margin-top:2rem;padding:1rem;background:#1e293b;border-radius:8px;font-size:.85rem">
          <h4 style="color:#f8fafc;margin:0 0 .5rem">Refer a Friend</h4>
          <p style="color:#94a3b8;margin:0 0 .75rem">Earn 25 tokens when a friend signs up, 150 more when they subscribe.</p>
          <div id="referralLinkBox" style="display:flex;gap:.5rem;align-items:center">
            <input id="referralLinkInput" type="text" readonly
              style="flex:1;background:#0f172a;color:#94a3b8;border:1px solid #334155;border-radius:6px;padding:.4rem .6rem;font-size:.8rem"
              value="Loading...">
            <button class="btn-ghost" style="font-size:.8rem;padding:.4rem .75rem" onclick="copyReferralLink()">Copy</button>
          </div>
        </div>
      </aside>
      <main class="tree-main">
        <div id="treeContainer">
          <p class="placeholder-text">Add a person to start building your family tree.</p>
        </div>
      </main>
    </div>
  </div>

  <!-- Connections tab panel -->
  <div id="tab-connections" class="tab-panel" style="display:none;height:100%;flex-direction:column">

    <!-- Conversation list -->
    <div id="connections-list" style="flex:1;overflow-y:auto;padding:16px">
      <h3 style="color:#f8fafc;margin:0 0 16px">Research Connections</h3>
      <div id="connections-list-items">
        <p style="color:#64748b">Loading...</p>
      </div>
      <div style="margin-top:24px;padding-top:16px;border-top:1px solid #1e293b">
        <label style="display:flex;align-items:center;gap:10px;color:#94a3b8;font-size:0.9em;cursor:pointer">
          <input type="checkbox" id="discovery-toggle" onchange="toggleDiscovery(this.checked)"
                 style="width:16px;height:16px">
          Show my ancestors to other researchers (discovery)
        </label>
      </div>
    </div>

    <!-- Conversation thread view -->
    <div id="connections-thread" style="display:none;flex:1;flex-direction:column;height:100%">
      <div style="padding:12px 16px;border-bottom:1px solid #1e293b;display:flex;align-items:center;gap:12px">
        <button onclick="closeThread()"
                style="background:none;border:none;color:#94a3b8;cursor:pointer;font-size:1.1em">←</button>
        <div>
          <div id="thread-title" style="color:#f8fafc;font-weight:600"></div>
          <div id="thread-ancestor" style="color:#94a3b8;font-size:0.85em"></div>
        </div>
      </div>
      <div id="thread-records" style="padding:10px 16px;background:#0a1628;border-bottom:1px solid #1e293b;
           overflow-x:auto;white-space:nowrap;min-height:44px"></div>
      <div id="thread-messages" style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px">
      </div>
      <div style="padding:12px 16px;border-top:1px solid #1e293b;display:flex;gap:8px">
        <textarea id="thread-input" rows="2"
          style="flex:1;background:#1e293b;border:1px solid #334155;border-radius:8px;color:#f8fafc;
                 padding:8px 12px;font-size:0.9em;resize:none"
          placeholder="Type a message..."
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendThreadMessage();}">
        </textarea>
        <button onclick="sendThreadMessage()"
                style="background:#4a7c59;color:#fff;border:none;border-radius:8px;
                       padding:0 20px;font-size:0.9em;cursor:pointer">Send</button>
      </div>
    </div>

  </div>

  <div id="addPersonModal" class="modal hidden">
    <div class="modal-content">
      <h3>Add Person to Search</h3>
      <div class="form-field">
        <input id="apFirst" placeholder="First name" class="input-field" autocomplete="off">
        <span class="form-error" id="apFirstErr"></span>
      </div>
      <div class="form-field">
        <input id="apLast" placeholder="Last name *" class="input-field" autocomplete="off">
        <span class="form-error" id="apLastErr"></span>
      </div>
      <div class="form-field">
        <input id="apBirthYear" placeholder="Birth year (e.g. 1820)" type="number" min="1600" max="1990" class="input-field">
        <span class="form-error" id="apBirthYearErr"></span>
      </div>
      <div class="form-field">
        <input id="apBirthPlace" placeholder="Birth state or country (e.g. Kentucky)" class="input-field" autocomplete="off">
        <span class="form-error" id="apBirthPlaceErr"></span>
      </div>
      <div class="modal-actions">
        <button class="btn-primary" id="addPersonBtn" onclick="addPerson()">Search &amp; Add</button>
        <button class="btn-ghost" onclick="closeModal('addPersonModal')">Cancel</button>
      </div>
    </div>
  </div>

  <div id="personCardOverlay" class="person-card-overlay hidden"></div>

  <script src="/static/js/tree.js"></script>
  <script src="/static/js/person_card.js"></script>
  <script>
    let currentTreeId = null;

    async function loadMe() {
      const r = await fetch('/api/me');
      if (r.status === 401) { showAuthOverlay(); return; }
      const data = await r.json();
      document.getElementById('tokenBadge').textContent = `${data.tokens} tokens`;
      if (data.tokens < 100) showLowBalanceToast(data.tokens);
      loadTrees();
      checkVerificationBanner();
    }

    function showLowBalanceToast(tokens) {
      const existing = document.getElementById('lowBalanceToast');
      if (existing) return;
      const toast = document.createElement('div');
      toast.id = 'lowBalanceToast';
      toast.style.cssText = 'position:fixed;bottom:1.5rem;right:1.5rem;background:#7f1d1d;color:#fca5a5;padding:.75rem 1.25rem;border-radius:8px;font-size:.875rem;z-index:9999;display:flex;gap:1rem;align-items:center';
      toast.innerHTML = `⚠️ ${tokens} tokens remaining. <a href="/pricing" style="color:#fca5a5;text-decoration:underline">Top up</a> <button onclick="this.parentElement.remove()" style="background:none;border:none;color:#fca5a5;cursor:pointer;font-size:1rem">✕</button>`;
      document.body.appendChild(toast);
    }

    async function loadTrees() {
      // Always fetch the user's tree list from the server — don't rely on localStorage alone
      const params = new URLSearchParams(window.location.search);
      const urlTreeId = params.get('tree');

      const resp = await fetch('/api/trees', {credentials: 'include'});
      if (!resp.ok) return;
      const data = await resp.json();
      const allTrees = [...(data.trees || []), ...(data.shared || [])];

      renderSavedTrees(allTrees);

      // Determine which tree to load: URL param → localStorage → most recently updated
      const localId = localStorage.getItem('lastTreeId');
      const targetId = urlTreeId || localId || (allTrees.length ? String(allTrees[0].id) : null);
      if (targetId) {
        currentTreeId = parseInt(targetId);
        localStorage.setItem('lastTreeId', currentTreeId);
        loadTree(currentTreeId);
      }
    }

    function renderSavedTrees(trees) {
      const container = document.getElementById('savedTreesList');
      if (!trees.length) { container.innerHTML = ''; return; }
      container.innerHTML = trees.map(t => `
        <div onclick="switchToTree(${t.id})" style="cursor:pointer;padding:6px 10px;border-radius:6px;margin-bottom:4px;background:${currentTreeId===t.id?'#1e40af':'#1e293b'};border:1px solid #334155" id="tree-item-${t.id}">
          <div style="font-size:.85rem;font-weight:600;color:#f1f5f9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escHtml(t.name)}</div>
          <div style="font-size:.72rem;color:#64748b">${t.person_count} ${t.person_count===1?'person':'people'}${t.owned?'':' · shared'}</div>
        </div>
      `).join('');
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    async function switchToTree(treeId) {
      currentTreeId = treeId;
      localStorage.setItem('lastTreeId', treeId);
      // Update active highlight
      document.querySelectorAll('[id^="tree-item-"]').forEach(el => {
        el.style.background = el.id === 'tree-item-' + treeId ? '#1e40af' : '#1e293b';
      });
      loadTree(treeId);
    }

    function clearFormErrors() {
      ['apFirst','apLast','apBirthYear','apBirthPlace'].forEach(id => {
        document.getElementById(id).classList.remove('input-error');
        document.getElementById(id + 'Err').textContent = '';
      });
    }

    function setFieldError(id, msg) {
      document.getElementById(id).classList.add('input-error');
      document.getElementById(id + 'Err').textContent = msg;
    }

    async function addPerson() {
      clearFormErrors();
      const first = document.getElementById('apFirst').value.trim();
      const last = document.getElementById('apLast').value.trim();
      const birthYearRaw = document.getElementById('apBirthYear').value.trim();
      const birthPlace = document.getElementById('apBirthPlace').value.trim();
      let valid = true;

      if (!last) { setFieldError('apLast', 'Last name is required.'); valid = false; }
      else if (!/^[A-Za-z\s'\-\.]+$/.test(last)) { setFieldError('apLast', 'Last name should contain only letters, spaces, hyphens, or apostrophes.'); valid = false; }

      if (first && !/^[A-Za-z\s'\-\.]+$/.test(first)) { setFieldError('apFirst', 'First name should contain only letters, spaces, hyphens, or apostrophes.'); valid = false; }

      let birthYear = null;
      if (birthYearRaw) {
        birthYear = parseInt(birthYearRaw);
        if (isNaN(birthYear) || birthYear < 1600 || birthYear > 1990) {
          setFieldError('apBirthYear', 'Enter a year between 1600 and 1990.'); valid = false;
        }
      }

      if (birthPlace && birthPlace.length > 100) { setFieldError('apBirthPlace', 'Keep the birth place under 100 characters.'); valid = false; }

      if (!valid) return;

      const btn = document.getElementById('addPersonBtn');
      btn.disabled = true;
      btn.textContent = 'Searching…';

      const r = await fetch('/api/persons', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          tree_name: last + ' Family',
          first_name: first, last_name: last,
          birth_year: birthYear, birth_state: birthPlace,
        })
      });
      const data = await r.json();
      btn.disabled = false;
      btn.textContent = 'Search & Add';
      if (!r.ok) { alert(data.error || 'Something went wrong. Please try again.'); return; }
      currentTreeId = data.tree_id;
      localStorage.setItem('lastTreeId', currentTreeId);
      closeModal('addPersonModal');
      loadTrees();
    }

    function showAddPersonForm() {
      clearFormErrors();
      document.getElementById('addPersonModal').classList.remove('hidden');
    }

    function downloadGedcom() {
      if (!currentTreeId) return;
      window.location.href = `/api/trees/${currentTreeId}/export/gedcom`;
    }

    function downloadPdf() {
      if (!currentTreeId) return;
      window.location.href = `/api/trees/${currentTreeId}/export/pdf`;
    }

    function showExportButtons(show) {
      const el = document.getElementById('exportButtons');
      el.style.display = show ? 'flex' : 'none';
    }

    async function importGedcom(input) {
      const file = input.files[0];
      if (!file) return;
      const text = await file.text();
      const label = input.parentElement;
      label.textContent = 'Importing…';
      const r = await fetch('/api/gedcom/import', {
        method: 'POST',
        headers: {'Content-Type': 'text/plain'},
        credentials: 'include',
        body: text,
      });
      const d = await r.json();
      label.innerHTML = `<input type="file" id="gedcomImport" accept=".ged,.gedcom" style="display:none" onchange="importGedcom(this)">↑ Import GEDCOM file`;
      if (!r.ok) { alert(d.error || 'Import failed.'); return; }
      alert(`Imported ${d.imported} person(s) from ${file.name}.`);
      loadTrees();
    }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

    async function logout() {
      await fetch('/auth/logout', {method: 'POST'});
      window.location.href = '/';
    }

    async function loadReferralPanel() {
      try {
        const r = await fetch('/api/me/referral');
        if (!r.ok) return;
        const data = await r.json();
        const link = 'https://rootbridge.app/register?ref=' + data.referral_code;
        document.getElementById('referralLinkInput').value = link;
      } catch (e) { /* silently ignore */ }
    }

    function copyReferralLink() {
      const input = document.getElementById('referralLinkInput');
      navigator.clipboard.writeText(input.value).then(function() {
        const btn = input.nextElementSibling;
        const orig = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(function() { btn.textContent = orig; }, 1500);
      });
    }

    loadMe();
    loadReferralPanel();

    // ── Tab switching ──────────────────────────────────────────────────────
    function switchTab(name) {
      document.querySelectorAll('.tab-panel').forEach(function(p) {
        p.style.display = 'none';
      });
      document.querySelectorAll('.tab-btn').forEach(function(b) {
        b.style.borderBottomColor = 'transparent';
        b.style.color = '#94a3b8';
      });
      var panel = document.getElementById('tab-' + name);
      if (panel) {
        panel.style.display = (name === 'tree') ? 'flex' : 'flex';
        panel.style.flexDirection = (name === 'tree') ? '' : 'column';
      }
      var btn = document.querySelector('[data-tab="' + name + '"]');
      if (btn) {
        btn.style.borderBottomColor = '#4a7c59';
        btn.style.color = '#f8fafc';
      }
      if (name === 'connections') loadConnections();
    }

    // ── Auth overlay (login / register / 2FA) ──────────────────────────────
    function showAuthOverlay() {
      const existing = document.getElementById('authOverlay');
      if (existing) return;
      const overlay = document.createElement('div');
      overlay.id = 'authOverlay';
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,.97);z-index:10000;display:flex;align-items:center;justify-content:center;padding:1rem';
      overlay.innerHTML = `
        <div style="background:#1e293b;border-radius:12px;padding:2.5rem 2rem;width:100%;max-width:400px;border:1px solid #334155">
          <div style="font-size:1.3rem;font-weight:700;color:#e2d9c4;margin-bottom:.25rem">🌿 RootBridge</div>
          <div id="authTitle" style="color:#94a3b8;font-size:.875rem;margin-bottom:1.5rem">Sign in to continue</div>
          <!-- Login form -->
          <div id="loginForm">
            <input id="authEmail" type="email" placeholder="Email address" autocomplete="email"
              style="width:100%;background:#0f172a;border:1px solid #334155;color:#f1f5f9;padding:.65rem .8rem;border-radius:6px;font-size:.9rem;margin-bottom:.75rem">
            <input id="authPassword" type="password" placeholder="Password" autocomplete="current-password"
              style="width:100%;background:#0f172a;border:1px solid #334155;color:#f1f5f9;padding:.65rem .8rem;border-radius:6px;font-size:.9rem;margin-bottom:.5rem">
            <div style="display:flex;justify-content:flex-end;margin-bottom:1rem">
              <a href="/reset-password" style="color:#60a5fa;font-size:.8rem;text-decoration:none">Forgot password?</a>
            </div>
            <button onclick="submitLogin()" style="width:100%;background:#2563eb;color:#fff;border:none;border-radius:6px;padding:.75rem;font-size:.9rem;cursor:pointer;font-weight:600;margin-bottom:.75rem">Sign In</button>
            <div style="text-align:center;font-size:.85rem;color:#64748b">
              No account? <a href="#" onclick="showRegisterForm();return false" style="color:#60a5fa">Create one free →</a>
            </div>
            <div id="authError" style="display:none;margin-top:.75rem;background:#7f1d1d;color:#fca5a5;padding:.6rem .8rem;border-radius:6px;font-size:.85rem"></div>
          </div>
          <!-- Register form -->
          <div id="registerForm" style="display:none">
            <input id="regEmail" type="email" placeholder="Email address" autocomplete="email"
              style="width:100%;background:#0f172a;border:1px solid #334155;color:#f1f5f9;padding:.65rem .8rem;border-radius:6px;font-size:.9rem;margin-bottom:.75rem">
            <input id="regPassword" type="password" placeholder="Password (8+ characters)" autocomplete="new-password"
              style="width:100%;background:#0f172a;border:1px solid #334155;color:#f1f5f9;padding:.65rem .8rem;border-radius:6px;font-size:.9rem;margin-bottom:.75rem">
            <button onclick="submitRegister()" style="width:100%;background:#2563eb;color:#fff;border:none;border-radius:6px;padding:.75rem;font-size:.9rem;cursor:pointer;font-weight:600;margin-bottom:.75rem">Create Free Account</button>
            <div style="text-align:center;font-size:.85rem;color:#64748b">
              Already have an account? <a href="#" onclick="showLoginForm();return false" style="color:#60a5fa">Sign in →</a>
            </div>
            <div style="font-size:.73rem;color:#475569;text-align:center;margin-top:.75rem">
              By registering you agree to our <a href="/terms" style="color:#60a5fa" target="_blank">Terms</a> and <a href="/privacy" style="color:#60a5fa" target="_blank">Privacy Policy</a>
            </div>
            <div id="regError" style="display:none;margin-top:.75rem;background:#7f1d1d;color:#fca5a5;padding:.6rem .8rem;border-radius:6px;font-size:.85rem"></div>
          </div>
          <!-- 2FA form -->
          <div id="twoFaForm" style="display:none">
            <p style="color:#94a3b8;font-size:.875rem;margin-bottom:1rem">A 6-digit code was sent to your email. Enter it below.</p>
            <input id="tfaCode" type="text" placeholder="000000" maxlength="6" inputmode="numeric"
              style="width:100%;background:#0f172a;border:1px solid #334155;color:#f1f5f9;padding:.65rem .8rem;border-radius:6px;font-size:1.4rem;letter-spacing:.4rem;text-align:center;margin-bottom:.75rem">
            <button onclick="submit2fa()" style="width:100%;background:#2563eb;color:#fff;border:none;border-radius:6px;padding:.75rem;font-size:.9rem;cursor:pointer;font-weight:600">Verify Code</button>
            <div id="tfaError" style="display:none;margin-top:.75rem;background:#7f1d1d;color:#fca5a5;padding:.6rem .8rem;border-radius:6px;font-size:.85rem"></div>
          </div>
        </div>`;
      document.body.appendChild(overlay);
      document.getElementById('authEmail').focus();
    }

    function showRegisterForm() {
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('registerForm').style.display = 'block';
      document.getElementById('authTitle').textContent = 'Create your free account';
      document.getElementById('regEmail').focus();
    }

    function showLoginForm() {
      document.getElementById('registerForm').style.display = 'none';
      document.getElementById('loginForm').style.display = 'block';
      document.getElementById('authTitle').textContent = 'Sign in to continue';
      document.getElementById('authEmail').focus();
    }

    let _tfaTempToken = null;

    async function submitLogin() {
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value;
      const errEl = document.getElementById('authError');
      errEl.style.display = 'none';
      if (!email || !password) { showAuthErr(errEl, 'Email and password required.'); return; }
      const r = await fetch('/auth/login', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({email, password}),
      });
      const data = await r.json();
      if (r.status === 202 && data.requires_2fa) {
        _tfaTempToken = data.temp_token;
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('twoFaForm').style.display = 'block';
        document.getElementById('authTitle').textContent = 'Two-factor verification';
        document.getElementById('tfaCode').focus();
        return;
      }
      if (!r.ok) { showAuthErr(errEl, data.error || 'Login failed.'); return; }
      document.getElementById('authOverlay').remove();
      loadMe();
    }

    async function submit2fa() {
      const code = document.getElementById('tfaCode').value.trim();
      const errEl = document.getElementById('tfaError');
      errEl.style.display = 'none';
      const r = await fetch('/api/auth/verify-2fa', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({temp_token: _tfaTempToken, code}),
      });
      const data = await r.json();
      if (!r.ok) { showAuthErr(errEl, data.error || 'Invalid code.'); return; }
      document.getElementById('authOverlay').remove();
      loadMe();
    }

    async function submitRegister() {
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const errEl = document.getElementById('regError');
      errEl.style.display = 'none';
      if (!email || !password) { showAuthErr(errEl, 'Email and password required.'); return; }
      if (password.length < 8) { showAuthErr(errEl, 'Password must be at least 8 characters.'); return; }
      const ref = sessionStorage.getItem('ref') || refCode || '';
      const r = await fetch('/auth/register', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({email, password, ref}),
      });
      const data = await r.json();
      if (!r.ok) { showAuthErr(errEl, data.error || 'Registration failed.'); return; }
      document.getElementById('authOverlay').remove();
      loadMe();
    }

    function showAuthErr(el, msg) {
      el.textContent = msg; el.style.display = 'block';
    }

    // ── Email verification banner ──────────────────────────────────────────
    async function checkVerificationBanner() {
      const r = await fetch('/api/auth/me');
      if (!r.ok) return;
      const data = await r.json();
      if (data.email_verified) return;
      const existing = document.getElementById('verifyBanner');
      if (existing) return;
      const banner = document.createElement('div');
      banner.id = 'verifyBanner';
      banner.style.cssText = 'background:#78350f;color:#fde68a;padding:.6rem 1rem;font-size:.82rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap';
      banner.innerHTML = `<span>📧 Please verify your email address to enable match notifications and collaboration features.</span>
        <div style="display:flex;gap:.75rem;align-items:center">
          <button onclick="resendVerification(this)" style="background:#92400e;color:#fde68a;border:none;border-radius:4px;padding:.3rem .75rem;cursor:pointer;font-size:.82rem">Resend Email</button>
          <button onclick="this.parentElement.parentElement.remove()" style="background:none;border:none;color:#fde68a;cursor:pointer;font-size:1.1rem">✕</button>
        </div>`;
      document.body.insertBefore(banner, document.body.firstChild);
    }

    async function resendVerification(btn) {
      btn.disabled = true; btn.textContent = 'Sent!';
      await fetch('/api/auth/resend-verification', {method: 'POST'});
    }

    // ── Edit person ────────────────────────────────────────────────────────
    function showEditPerson(personId, p) {
      const overlay = document.getElementById('personCardOverlay');
      overlay.innerHTML = `
        <div class="person-card">
          <button class="card-close" onclick="closePersonCard()">✕</button>
          <h3 style="color:#e2d9c4;margin-bottom:1.25rem">Edit Person</h3>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem">
            <div><label style="font-size:.78rem;color:#94a3b8;display:block;margin-bottom:.25rem">First Name</label>
              <input id="ep_first" value="${escHtml(p.first_name||'')}" class="input-field" style="width:100%"></div>
            <div><label style="font-size:.78rem;color:#94a3b8;display:block;margin-bottom:.25rem">Last Name</label>
              <input id="ep_last" value="${escHtml(p.last_name||'')}" class="input-field" style="width:100%"></div>
            <div><label style="font-size:.78rem;color:#94a3b8;display:block;margin-bottom:.25rem">Birth Year</label>
              <input id="ep_by" type="number" value="${p.birth_year||''}" class="input-field" style="width:100%" placeholder="e.g. 1842"></div>
            <div><label style="font-size:.78rem;color:#94a3b8;display:block;margin-bottom:.25rem">Birth State / Country</label>
              <input id="ep_bplace" value="${escHtml(p.birth_state||p.birth_country||'')}" class="input-field" style="width:100%"></div>
            <div><label style="font-size:.78rem;color:#94a3b8;display:block;margin-bottom:.25rem">Death Year</label>
              <input id="ep_dy" type="number" value="${p.death_year||''}" class="input-field" style="width:100%" placeholder="leave blank if living"></div>
            <div><label style="font-size:.78rem;color:#94a3b8;display:block;margin-bottom:.25rem">Death Place</label>
              <input id="ep_dplace" value="${escHtml(p.death_place||'')}" class="input-field" style="width:100%"></div>
          </div>
          <div style="margin-top:.75rem"><label style="font-size:.78rem;color:#94a3b8;display:block;margin-bottom:.25rem">Notes</label>
            <textarea id="ep_notes" class="input-field" style="width:100%;height:80px;resize:vertical">${escHtml(p.notes||'')}</textarea></div>
          <div id="ep_err" style="display:none;color:#f87171;font-size:.82rem;margin-top:.5rem"></div>
          <div style="display:flex;gap:.75rem;margin-top:1rem">
            <button class="btn-primary" onclick="saveEditPerson(${personId})">Save Changes</button>
            <button class="btn-ghost" onclick="openPersonCard(${personId})">Cancel</button>
          </div>
          <style>.input-field{background:#0f172a;border:1px solid #334155;color:#f1f5f9;padding:.55rem .75rem;border-radius:6px;font-size:.9rem}.input-field:focus{outline:2px solid #2563eb;border-color:transparent}</style>
        </div>`;
    }

    async function saveEditPerson(personId) {
      const by = document.getElementById('ep_by').value;
      const dy = document.getElementById('ep_dy').value;
      const bplace = document.getElementById('ep_bplace').value.trim();
      const payload = {
        first_name: document.getElementById('ep_first').value.trim(),
        last_name: document.getElementById('ep_last').value.trim(),
        birth_year: by ? parseInt(by) : null,
        birth_state: bplace,
        birth_country: null,
        death_year: dy ? parseInt(dy) : null,
        death_place: document.getElementById('ep_dplace').value.trim(),
        notes: document.getElementById('ep_notes').value.trim(),
      };
      const r = await fetch('/api/persons/' + personId, {
        method: 'PUT', headers: {'Content-Type':'application/json'},
        body: JSON.stringify(payload),
      });
      if (r.ok) { openPersonCard(personId); }
      else {
        const errEl = document.getElementById('ep_err');
        const d = await r.json().catch(() => ({}));
        errEl.textContent = d.error || 'Save failed.'; errEl.style.display = 'block';
      }
    }
  </script>

  <script>
    // ── Connections tab ────────────────────────────────────────────────────

    function escapeHtml(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    let _currentMatchId = null;

    async function loadConnections() {
      try {
        const r = await fetch('/api/matches', { credentials: 'include' });
        if (!r.ok) return;
        const { matches, total_unread } = await r.json();

        const badge = document.getElementById('connections-badge');
        if (badge) {
          if (total_unread > 0) {
            badge.textContent = total_unread;
            badge.style.display = 'inline';
          } else {
            badge.style.display = 'none';
          }
        }

        const list = document.getElementById('connections-list-items');
        if (!list) return;
        if (!matches.length) {
          list.innerHTML = '<p style="color:#64748b">No research connections yet. As more people join RootBridge and build their trees, you\'ll see matches here.</p>';
        } else {
          list.innerHTML = matches.map(m => `
            <div onclick="openThread(${m.match_id})"
                 style="background:#1e293b;border-radius:8px;padding:12px 14px;margin-bottom:8px;
                        cursor:pointer;border-left:3px solid ${m.unread_count ? '#4a7c59' : '#334155'}">
              <div style="display:flex;justify-content:space-between;align-items:center">
                <span style="color:#f8fafc;font-weight:600">${escapeHtml(m.display_name)}</span>
                ${m.unread_count ? `<span style="background:#4a7c59;color:#fff;border-radius:10px;padding:0 8px;font-size:0.75em">${m.unread_count} new</span>` : ''}
              </div>
              <div style="color:#94a3b8;font-size:0.85em;margin-top:2px">${escapeHtml(m.ancestor_name)}</div>
              ${m.last_message ? `<div style="color:#64748b;font-size:0.8em;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escapeHtml(m.last_message)}</div>` : ''}
            </div>`).join('');
        }

        // Load discovery toggle state
        const meR = await fetch('/api/me', { credentials: 'include' });
        if (meR.ok) {
          const me = await meR.json();
          const toggle = document.getElementById('discovery-toggle');
          if (toggle && me.discovery_enabled !== undefined) {
            toggle.checked = me.discovery_enabled;
          }
        }
      } catch (e) { /* silently ignore */ }
    }

    async function openThread(matchId) {
      _currentMatchId = matchId;
      document.getElementById('connections-list').style.display = 'none';
      const thread = document.getElementById('connections-thread');
      thread.style.display = 'flex';
      thread.style.flexDirection = 'column';

      const r = await fetch('/api/matches', { credentials: 'include' });
      if (!r.ok) return;
      const { matches } = await r.json();
      const match = matches.find(m => m.match_id === matchId);
      if (match) {
        document.getElementById('thread-title').textContent = match.display_name;
        document.getElementById('thread-ancestor').textContent = match.ancestor_name;

        const strip = document.getElementById('thread-records');
        const allRecords = [
          ...match.your_records.map(r2 => ({ ...r2, mine: true })),
          ...match.their_records.map(r2 => ({ ...r2, mine: false })),
        ];
        const safeUrl = (u) => (u && /^https?:\/\//.test(u)) ? u : '#';
        strip.innerHTML = allRecords.length ? allRecords.map(r2 => `
          <a href="${safeUrl(r2.url)}" target="_blank"
             style="display:inline-block;background:${r2.mine ? '#1e3a5f' : '#1a3d2b'};
                    border-radius:6px;padding:4px 10px;margin-right:6px;font-size:0.8em;
                    color:${r2.mine ? '#60a5fa' : '#4ade80'};text-decoration:none;white-space:nowrap">
            ${escapeHtml(r2.source)} — ${escapeHtml(r2.record_type) || 'Record'}
          </a>`).join('') : '<span style="color:#64748b;font-size:0.85em">No records shared yet</span>';
      }

      await fetchThreadMessages(matchId);
      fetch(`/api/matches/${matchId}/seen`, { method: 'POST', credentials: 'include' });
      loadConnections();
    }

    async function fetchThreadMessages(matchId) {
      const r = await fetch(`/api/matches/${matchId}/messages`, { credentials: 'include' });
      if (!r.ok) return;
      const messages = await r.json();
      const container = document.getElementById('thread-messages');
      if (!container) return;
      container.innerHTML = messages.map(msg => `
        <div style="display:flex;flex-direction:column;align-items:${msg.is_mine ? 'flex-end' : 'flex-start'}">
          <div style="max-width:70%;background:${msg.is_mine ? '#1a3d2b' : '#1e293b'};
                      border-radius:${msg.is_mine ? '12px 12px 2px 12px' : '12px 12px 12px 2px'};
                      padding:10px 14px;color:${msg.is_mine ? '#d1fae5' : '#f8fafc'};font-size:0.9em">
            ${escapeHtml(msg.body)}
          </div>
          <div style="color:#475569;font-size:0.75em;margin-top:2px">
            ${new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
          </div>
        </div>`).join('');
      container.scrollTop = container.scrollHeight;
    }

    async function sendThreadMessage() {
      if (!_currentMatchId) return;
      const input = document.getElementById('thread-input');
      const body = (input.value || '').trim();
      if (!body) return;
      input.value = '';
      const r = await fetch(`/api/matches/${_currentMatchId}/messages`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ body }),
      });
      if (r.status === 403) {
        const d = await r.json();
        alert(d.error + '\n\nUpgrade at /pricing');
        return;
      }
      if (r.ok) await fetchThreadMessages(_currentMatchId);
    }

    function closeThread() {
      _currentMatchId = null;
      const thread = document.getElementById('connections-thread');
      if (thread) thread.style.display = 'none';
      const list = document.getElementById('connections-list');
      if (list) list.style.display = 'flex';
    }

    async function toggleDiscovery(enabled) {
      await fetch('/api/auth/discovery', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ discovery_enabled: enabled }),
      });
    }

    async function refreshBadge() {
      try {
        const r = await fetch('/api/matches', { credentials: 'include' });
        if (!r.ok) return;
        const { total_unread } = await r.json();
        const badge = document.getElementById('connections-badge');
        if (badge) {
          badge.textContent = total_unread > 0 ? total_unread : '';
          badge.style.display = total_unread > 0 ? 'inline' : 'none';
        }
      } catch (e) {}
    }

    // Load badge on page load, refresh every 60s
    document.addEventListener('DOMContentLoaded', () => {
      refreshBadge();
      setInterval(refreshBadge, 60000);
    });
  </script>
</body>
</html>
